<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606D"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#F7F9FC"/>

  <text x="40" y="46" font-size="22" font-weight="800" fill="#16324F">How Eye Voice turns a gaze into speech</text>

  <!-- ===== Row 1: gaze pipeline ===== -->
  <g font-size="14" font-weight="700">
    <!-- Camera -->
    <rect x="40" y="90" width="160" height="80" rx="14" fill="#DCEAF5" stroke="#16324F" stroke-width="2"/>
    <text x="120" y="124" text-anchor="middle" fill="#16324F">Webcam</text>
    <text x="120" y="144" text-anchor="middle" fill="#52606D" font-weight="500" font-size="12">getUserMedia()</text>

    <path d="M200,130 H244" stroke="#52606D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- MediaPipe -->
    <rect x="248" y="90" width="190" height="80" rx="14" fill="#E9DDF5" stroke="#573B80" stroke-width="2"/>
    <text x="343" y="118" text-anchor="middle" fill="#573B80">MediaPipe</text>
    <text x="343" y="136" text-anchor="middle" fill="#573B80">Face Landmarker</text>
    <text x="343" y="154" text-anchor="middle" fill="#52606D" font-weight="500" font-size="12">478 landmarks · iris points</text>

    <path d="M438,130 H482" stroke="#52606D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Gaze estimator -->
    <rect x="486" y="90" width="190" height="80" rx="14" fill="#E9DDF5" stroke="#573B80" stroke-width="2"/>
    <text x="581" y="118" text-anchor="middle" fill="#573B80">Gaze Estimator</text>
    <text x="581" y="136" text-anchor="middle" fill="#52606D" font-weight="500" font-size="12">iris / eye-corner ratio</text>
    <text x="581" y="152" text-anchor="middle" fill="#52606D" font-weight="500" font-size="12">+ smoothing</text>

    <path d="M676,130 H720" stroke="#52606D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Calibration -->
    <rect x="724" y="90" width="190" height="80" rx="14" fill="#E9DDF5" stroke="#573B80" stroke-width="2"/>
    <text x="819" y="118" text-anchor="middle" fill="#573B80">Calibration</text>
    <text x="819" y="136" text-anchor="middle" fill="#52606D" font-weight="500" font-size="12">9-point affine fit</text>
    <text x="819" y="152" text-anchor="middle" fill="#52606D" font-weight="500" font-size="12">gaze &#8594; screen xy</text>

    <path d="M914,130 H958" stroke="#52606D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Dwell selection -->
    <rect x="962" y="90" width="198" height="80" rx="14" fill="#CDEFEA" stroke="#00A896" stroke-width="2"/>
    <text x="1061" y="118" text-anchor="middle" fill="#00695C">Direction + Dwell</text>
    <text x="1061" y="136" text-anchor="middle" fill="#00695C">Selection</text>
    <text x="1061" y="152" text-anchor="middle" fill="#52606D" font-weight="500" font-size="12">hold gaze ~1s to trigger</text>
  </g>

  <!-- down to action router -->
  <path d="M1061,170 V210" stroke="#52606D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Action router -->
  <rect x="450" y="214" width="360" height="64" rx="14" fill="#16324F"/>
  <text x="630" y="252" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">UP · LEFT · RIGHT · DOWN · CLEAR</text>
  <path d="M962,240 H814" stroke="#52606D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- branch to speak -->
  <path d="M540,278 V320" stroke="#52606D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="420" y="324" width="240" height="70" rx="14" fill="#DDF3EA" stroke="#2E9B6F" stroke-width="2"/>
  <text x="540" y="352" text-anchor="middle" fill="#1B7A50" font-size="14" font-weight="700">Speak selected word</text>
  <text x="540" y="370" text-anchor="middle" fill="#52606D" font-size="12">Web Speech synthesis (TTS)</text>

  <!-- branch to listen -->
  <path d="M720,278 V320" stroke="#52606D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="680" y="324" width="240" height="70" rx="14" fill="#FBE9C6" stroke="#F2B134" stroke-width="2"/>
  <text x="800" y="352" text-anchor="middle" fill="#8A5A00" font-size="14" font-weight="700">Listen (UP look)</text>
  <text x="800" y="370" text-anchor="middle" fill="#52606D" font-size="12">Web Speech recognition (STT)</text>

  <!-- listen -> gemini -->
  <path d="M800,394 V420" stroke="#52606D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="655" y="424" width="290" height="70" rx="14" fill="#E9DDF5" stroke="#573B80" stroke-width="2"/>
  <text x="800" y="450" text-anchor="middle" fill="#573B80" font-size="14" font-weight="700">Gemini API</text>
  <text x="800" y="468" text-anchor="middle" fill="#52606D" font-size="12">transcript &#8594; 4-6 reply suggestions</text>
  <text x="800" y="483" text-anchor="middle" fill="#8A5A00" font-size="11" font-weight="700">falls back to local keyword rules offline</text>

  <path d="M655,459 H420" stroke="#52606D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="150" y="424" width="270" height="70" rx="14" fill="#CDEFEA" stroke="#00A896" stroke-width="2"/>
  <text x="285" y="450" text-anchor="middle" fill="#00695C" font-size="14" font-weight="700">Quick Words carousel</text>
  <text x="285" y="468" text-anchor="middle" fill="#52606D" font-size="12">gaze LEFT / RIGHT / DOWN to speak</text>

  <path d="M150,459 C90,459 90,250 148,250" stroke="#52606D" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="60" y="345" fill="#52606D" font-size="11" font-weight="600" transform="rotate(-90 60 345)">feeds next dwell target</text>

  <!-- legend -->
  <g font-size="12" font-weight="600">
    <rect x="40" y="520" width="14" height="14" rx="3" fill="#CDEFEA" stroke="#00A896"/>
    <text x="60" y="531" fill="#52606D">Runs on-device</text>
    <rect x="200" y="520" width="14" height="14" rx="3" fill="#E9DDF5" stroke="#573B80"/>
    <text x="220" y="531" fill="#52606D">Model inference (browser, WASM/GPU)</text>
    <rect x="500" y="520" width="14" height="14" rx="3" fill="#FBE9C6" stroke="#F2B134"/>
    <text x="520" y="531" fill="#52606D">Browser Web Speech API</text>
    <rect x="720" y="520" width="14" height="14" rx="3" fill="#E9DDF5" stroke="#573B80"/>
    <text x="740" y="531" fill="#52606D">Optional cloud call (Gemini, text only)</text>
  </g>
</svg>
