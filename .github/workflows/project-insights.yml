name: Refresh community visuals

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate star history and contributor map
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_project_insights.py

      - name: Commit changed analytics
        run: |
          if git diff --quiet -- assets/star-history.svg assets/contributor-map.svg; then
            echo "Community visuals are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg assets/contributor-map.svg
          git commit -m "chore: refresh community visuals"
          git push
