name: Quality checks

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Parse GitHub Actions workflows
        run: npm run check:workflows

      - name: Validate contributor country overrides
        run: python scripts/validate_contributor_locations.py

      - name: Check local HTML references
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          class References(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values = []
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  for key in ("src", "href"):
                      if key in data:
                          self.values.append(data[key].split("?")[0])

          parser = References()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          missing = []
          for value in parser.values:
              parsed = urlparse(value)
              if parsed.scheme or value.startswith(("#", "data:", "//")):
                  continue
              if not Path(value).exists():
                  missing.append(value)
          if missing:
              raise SystemExit("Missing local references: " + ", ".join(missing))

      - name: Run deterministic unit and policy tests
        run: npm run test:unit

      - name: Run browser accessibility and visual regression tests
        run: npm run test:browser

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
