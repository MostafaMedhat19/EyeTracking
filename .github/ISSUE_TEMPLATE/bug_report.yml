name: Bug report
description: Report a reproducible problem in Eye Voice
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Thank you for helping improve Eye Voice. Do not include API keys, camera recordings, medical data, or private transcripts."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start tracking\n2. Complete calibration\n3. ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, version, operating system, and device
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: Input method affected
      options: [Gaze control, Keyboard, Speech recognition, Text to speech, Calibration, Other]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed API keys and personal/sensitive data from this report.
          required: true
