<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Eye Voice — Assistive Communication</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%2316324F'/%3E%3Ccircle cx='50' cy='50' r='24' fill='%2300A896'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/accessibility.css">
</head>
<body>
  <div id="permissionScreen" class="permission-screen">
    <main class="permission-card"><div class="eye-mark">◉</div><h1>Eye Voice</h1><p>Camera access is required for eye tracking. Video stays on this device and is never recorded or uploaded.</p><button id="startTracking" class="primary-action">START EYE TRACKING</button><p id="permissionMessage" class="notice" aria-live="polite"></p></main>
  </div>
  <main id="app" class="app" hidden>
    <header class="topbar"><div class="rec"><span></span> LIVE</div><h1>Eye Voice</h1><div id="trackingStatus" class="tracking-status">● STARTING TRACKING</div></header>
    <section class="tracking-panel" aria-label="Eye tracking camera">
      <div class="camera-heading"><span>RECORDING EYE MOTION</span><span id="cameraMessage" aria-live="polite">Starting camera…</span></div>
      <div class="camera-layout">
        <div class="direction up" data-direction="UP" data-gaze-target role="button" tabindex="0" aria-label="Start or stop listening"><span class="dir-icon">↑</span><span class="dir-label">Listen</span></div><div class="direction left" data-direction="LEFT" data-gaze-target role="button" tabindex="0" aria-label="Previous word"><span class="dir-icon">←</span><span class="dir-label">Prev</span></div>
        <div class="camera-frame"><video id="webcam" autoplay playsinline muted aria-hidden="true"></video><canvas id="landmarkCanvas" aria-hidden="true"></canvas><div class="center-indicator" data-direction="CENTER">●</div></div>
        <div class="direction right" data-direction="RIGHT" data-gaze-target role="button" tabindex="0" aria-label="Next word"><span class="dir-icon">→</span><span class="dir-label">Next</span></div><div class="direction down" data-direction="DOWN" data-gaze-target data-dwell-ms="3000" role="button" tabindex="0" aria-label="Select and speak word"><span class="dir-icon">↓</span><span class="dir-label">Select</span></div>
      </div>
    </section>
    <section class="message-section" aria-label="Current message">
      <div class="message-content"><h2 class="section-label">MESSAGE</h2><output id="sentence" aria-live="polite">…</output></div>
      <button id="clearMessage" class="clear-button" data-gaze-target data-action="clear" aria-label="Clear message">CLEAR</button>
    </section>
    <section class="actions" aria-label="Speech actions">
      <button class="action-button listen" data-gaze-target data-action="listen"><span>🎙</span> LISTEN</button>
    </section>
    <p id="listenResult" class="listen-result" aria-live="polite"></p>
    <section class="word-section carousel-section"><h2>QUICK WORDS</h2><div id="quickCarousel" class="word-carousel" aria-label="Quick words slider"></div><button id="quickSelect" class="carousel-select full-select" data-gaze-target data-dwell-ms="3000" data-carousel="quick" data-select="true" aria-label="Select and speak this word">SELECT &amp; SPEAK<span>🔊↓</span></button></section>
    <section class="settings"><h2>SETTINGS</h2><label>Dwell time <select id="dwellTime"><option value="700">700 ms</option><option value="800">800 ms</option><option value="1000" selected>1000 ms</option><option value="1200">1200 ms</option><option value="1500">1500 ms</option></select></label><label>Sensitivity <select id="sensitivity"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label><label>Voice <select id="voiceSelect"></select></label><label>Language <select id="language"><option value="en-US">English</option><option value="ar-EG">Arabic</option></select></label><span class="settings-divider" aria-hidden="true"></span><label>Gemini API key <input id="geminiApiKey" type="password" autocomplete="off" spellcheck="false" placeholder="Paste a new key"></label><span class="settings-divider" aria-hidden="true"></span><button id="recalibrate" data-gaze-target class="recalibrate">RECALIBRATE</button><button id="debugToggle" class="debug-toggle">Debug</button></section>
    <aside id="debugPanel" class="debug-panel" hidden aria-live="polite"></aside>
  </main>
  <div id="gazeCursor" aria-hidden="true"></div><div id="calibration" class="calibration" hidden><p id="calibrationText">Look at the dot</p><div id="calibrationDot"></div></div>
  <script type="module" src="js/app.js?v=20260906-11"></script>
</body>
</html>
